name: Docs site

# Checks and builds the site.

on:
  workflow_call:

permissions: {}

jobs:
  # A merge queue group whose tree is its pull request's own head passed that
  # pull request's check, so the queue does not build it again.
  scope:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - name: What is left to prove
        id: scope
        env:
          GROUP: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          api() {
            curl --proto '=https' -sSf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"
          }
          reason=""
          number=$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$HEAD_REF")
          if [ -n "$number" ]; then
            head=$(api "pulls/$number" | jq -r .head.sha)
            if [ "$(api "git/commits/$GROUP" | jq -r .tree.sha)" = "$(api "git/commits/$head" | jq -r .tree.sha)" ]; then
              reason="the group's tree is pull request #$number's head, whose check passed"
              echo "nothing to check: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "skip=$reason" >> "$GITHUB_OUTPUT"

  # Skipped scope (every event but the merge queue) leaves the build to run.
  build:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.skip == '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history: each page's "Last updated" date comes from its last
      # commit, and a shallow clone would date every page to the newest one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # No lifecycle scripts: the only one installs git hooks, which CI has
      # no use for.
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build

      - name: Check
        run: bun run check

      # A pull request that changes the page rules checks every mod page on
      # the mods repository's main against them, so the mods pin bump that
      # follows its merge never finds a page the new rules refuse. The paths
      # are check-player-page.ts and what it imports; anything wider would
      # turn unrelated pull requests red over a page on mods main.
      - name: Scope the mod pages
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          git diff --quiet "$BASE...HEAD" --
          .github/workflows/docs-site.yml
          tools/check-player-page.ts
          tools/lib/player-prose.ts
          tools/lib/player-page-source.ts
          tools/lib/meta-description.ts
          tools/lib/sentences.ts
          src/site/player-page.ts
          src/site/types.ts
          src/data/site.json
          || echo "pages=true" >> "$GITHUB_OUTPUT"

      # The whole docs folders at any depth: a page's pictures sit beside it.
      - if: steps.scope.outputs.pages == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/mods
          ref: main
          path: .cache/mods
          persist-credentials: false
          sparse-checkout: '**/docs/'
          sparse-checkout-cone-mode: false

      - name: Check the mod pages
        if: steps.scope.outputs.pages == 'true'
        run: |
          shopt -s globstar
          bun tools/check-player-page.ts .cache/mods/**/docs/player*.md
