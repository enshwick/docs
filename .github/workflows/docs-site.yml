name: Docs site

# Checks and builds the site.

on:
  workflow_call:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history: each page's "Last updated" date comes from its last
      # commit, and a shallow clone would date every page to the newest one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # No lifecycle scripts: the only one installs git hooks, which CI has
      # no use for.
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build

      - name: Check
        run: bun run check

      # A pull request that changes the page rules checks every mod page on
      # the mods repository's main against them, so the mods pin bump that
      # follows its merge never finds a page the new rules refuse. The paths
      # are check-player-page.ts and what it imports; anything wider would
      # turn unrelated pull requests red over a page on mods main.
      - name: Scope the mod pages
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          git diff --quiet "$BASE...HEAD" --
          .github/workflows/docs-site.yml
          tools/check-player-page.ts
          tools/lib/player-prose.ts
          tools/lib/player-page-source.ts
          tools/lib/meta-description.ts
          tools/lib/sentences.ts
          src/site/player-page.ts
          src/site/types.ts
          src/data/site.json
          || echo "pages=true" >> "$GITHUB_OUTPUT"

      # The whole docs folders at any depth: a page's pictures sit beside it.
      - if: steps.scope.outputs.pages == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/mods
          ref: main
          path: .cache/mods
          persist-credentials: false
          sparse-checkout: '**/docs/'
          sparse-checkout-cone-mode: false

      - name: Check the mod pages
        if: steps.scope.outputs.pages == 'true'
        run: |
          shopt -s globstar
          bun tools/check-player-page.ts .cache/mods/**/docs/player*.md
