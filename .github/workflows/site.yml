# Checks and builds the site on every pull request, and deploys it to
# Cloudflare from main. The repositories that feed in pages, such as the
# platform's book, start a run when those change.
name: site

on:
  # Every pull request, so the required check always reports.
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'LICENSE'
      - 'renovate.json'
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    uses: ./.github/workflows/docs-site.yml
    permissions:
      contents: read
    with:
      deploy: ${{ github.event_name != 'pull_request' }}
    # Only a deploy needs Cloudflare; a pull request gets no secrets.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
