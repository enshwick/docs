# Checks and builds the site on every pull request and on main. Cloudflare
# Workers Builds deploys main; this workflow never deploys.
name: site

on:
  # Every pull request, so the required check always reports; a draft reports
  # it skipped, which counts as passed, and marking it ready runs it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'LICENSE'
      - 'renovate.json'

permissions: {}

concurrency:
  group: site-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    uses: ./.github/workflows/docs-site.yml
    permissions:
      contents: read
