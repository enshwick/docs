# Checks and builds the site on every pull request and on main. Cloudflare
# Workers Builds deploys main; this workflow never deploys.
name: site

on:
  # Every ready pull request, so the required check always reports; a draft
  # runs nothing, and marking it ready runs the check.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'LICENSE'
      - 'renovate.json'

permissions: {}

concurrency:
  group: site-${{ github.head_ref || github.ref }}-${{ github.event.pull_request.draft }} # a draft's late run never cancels a ready one
  cancel-in-progress: true

jobs:
  # Skipped here, a draft reports no `site / build` at all: a skipped one
  # counts as passed, still once the pull request is marked ready, before
  # the ready run's own check exists, and on a re-run of the draft's run.
  site:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/docs-site.yml
    permissions:
      contents: read
